[project]
name = "frigatebird"
version = "0.1.0"
description = "A minimal AI harness / coding-agent CLI, built for learning."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
]

[project.scripts]
frigatebird = "frigatebird.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frigatebird*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
